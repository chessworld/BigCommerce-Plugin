name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

      # `npx next build` rather than `npm run build`: the postbuild script runs the
      # database migration (scripts/db.js), which needs a real database and is a
      # deploy-time concern — Vercel runs it with real credentials on deployment.
      - name: Build
        run: npx next build
        env:
          # The build never opens a database connection, but provide a syntactically
          # valid placeholder so any import-time URL parsing cannot fail.
          POSTGRES_URL: postgres://ci:ci@localhost:5432/ci
